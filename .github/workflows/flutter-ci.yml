name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test-build:
    name: 静态检查、单元测试与 Web 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出源代码
        uses: actions/checkout@v4
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - name: 生成平台工程
        run: flutter create --project-name daymark_flutter .
      - name: 下载依赖
        run: flutter pub get
      - name: 静态分析
        run: flutter analyze
      - name: 单元测试
        run: flutter test
      - name: 构建 Web
        run: flutter build web --release
