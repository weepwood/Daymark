name: daymark_flutter
description: 一款轻量、美观、离线优先的 Flutter 任务管理应用。
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  toastification: ^3.2.2
  flutter_slidable: ^5.2.0
  skeletonizer: ^3.0.0
  gap: ^3.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
